<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-labelledby="title desc">
  <title id="title">Cyberrah security operations portfolio</title>
  <desc id="desc">A dark blue console with a cyan radar sweep and labels for endpoint events, network telemetry, and email triage.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101e33"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="sweep" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#59ecff" stop-opacity=".48"/>
      <stop offset="1" stop-color="#59ecff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#274c67" opacity=".48"/>
    </pattern>
    <clipPath id="panel-clip"><rect x="1" y="1" width="838" height="238" rx="18"/></clipPath>
  </defs>
  <style>
    .sweep { transform-origin: 681px 120px; animation: scan 3.8s cubic-bezier(.3,.1,.3,1) 1; }
    @keyframes scan { from { transform: rotate(-145deg); } to { transform: rotate(215deg); } }
    @media (prefers-reduced-motion: reduce) { .sweep { animation: none; } }
  </style>
  <g clip-path="url(#panel-clip)">
    <path fill="url(#panel)" d="M0 0h840v240H0z"/>
    <path fill="url(#grid)" d="M552 0h288v240H552z"/>
    <path stroke="#284b67" d="M552 0v240M0 194h552"/>
    <path stroke="#59ecff" stroke-width="3" d="M37 1h146"/>
    <g font-family="monospace">
      <text x="37" y="50" fill="#7ff1ff" font-size="16" font-weight="bold" letter-spacing="3">CYBERRAH / PORTFOLIO</text>
      <text x="35" y="111" fill="#f2f7ff" font-size="48" font-weight="bold">SOC WORKBENCH</text>
      <text x="38" y="153" fill="#b9ccdd" font-size="18" letter-spacing=".5">Detect / Investigate / Report</text>
      <g fill="#a9c6da" font-size="13" letter-spacing="1">
        <circle cx="41" cy="217" r="3" fill="#59ecff"/><text x="53" y="222">ENDPOINT</text>
        <circle cx="187" cy="217" r="3" fill="#59ecff"/><text x="199" y="222">NETWORK</text>
        <circle cx="321" cy="217" r="3" fill="#59ecff"/><text x="333" y="222">EMAIL</text>
      </g>
    </g>
    <g fill="none" stroke="#3e7493">
      <circle cx="681" cy="120" r="86"/>
      <circle cx="681" cy="120" r="58"/>
      <circle cx="681" cy="120" r="29"/>
      <path d="M681 27v186M588 120h186" stroke-dasharray="3 5"/>
    </g>
    <g class="sweep">
      <path d="M681 120h86a86 86 0 0 0-35-69z" fill="url(#sweep)"/>
      <path d="M681 120h86" stroke="#59ecff" stroke-width="2"/>
    </g>
    <g fill="#7ff1ff">
      <circle cx="681" cy="120" r="4"/>
      <circle cx="714" cy="80" r="4"/>
      <circle cx="639" cy="152" r="3"/>
      <circle cx="741" cy="137" r="3"/>
    </g>
  </g>
  <rect x="1" y="1" width="838" height="238" rx="18" fill="none" stroke="#3e7493"/>
</svg>
